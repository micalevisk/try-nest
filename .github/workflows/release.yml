##
## Release
##
## This workflows aims to prepare the package for release to GitHub Package Registry.
## This can only be triggered manually via GitHub CLI/web.
##
## The whole process must take at most 3 minutes.
##
## Authentication to the NPM registry is trusted publishing (OIDC): the job
## mints a short-lived id-token and `@semantic-release/npm` exchanges it with
## the registry, so there is no `NPM_TOKEN` secret to rotate. This needs a
## trusted publisher configured for the `try-nest` package on npmjs.com,
## pointing at this repository and this workflow file. A long-lived token is
## not an option anymore: npm revoked classic tokens, and granular ones demand
## a one-time password on publish unless they opt out of 2FA, which is what
## made the 1.1.0 release fail with `EOTP`.
##

name: 'Release & publish to NPM Registry'

on:
  ## Allow triggering this workflow manually via GitHub CLI/web
  workflow_dispatch:

permissions:
  contents: read # for checkout

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # for the release commit and tag
      id-token: write # for npm trusted publishing (OIDC)
    steps:
      ##########################################################################
      ######################### Prepare the environment ########################
      ##########################################################################
      - name: 'Checkout the repository'
        uses: actions/checkout@v7
      - name: 'Use node24'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: 'npm ci --ignore-scripts'
      ##########################################################################
      - name: 'Build the project'
        run: 'npm run build'
      - name: 'Publish the lib'
        run: 'npx semantic-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
